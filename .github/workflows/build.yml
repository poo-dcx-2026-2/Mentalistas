# Integração contínua da disciplina.
#
# Este workflow já vem pronto. Na Unidade 1 você só precisa entender o que ele
# faz e saber ler o resultado: verde significa que compilou e que todos os testes
# passaram; vermelho significa que algo quebrou, e o log diz o quê.
#
# Na Unidade 3 você vai abrir este arquivo, entender cada parte e alterá-lo.
# Até lá, não é necessário mexer aqui.

name: build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-e-testes:
    name: Compilar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e rodar os testes
        run: mvn -B verify

      - name: Guardar os relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: target/surefire-reports/
          if-no-files-found: ignore
